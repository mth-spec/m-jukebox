name: Add Music to Playlist

on:
  issues:
    types: [opened]

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue Body and Update JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = context.payload.issue.body || "";
            
            // URLを抽出する正規表現
            const urlMatch = issueBody.match(/https?:\/\/[^\s]+/);
            if (!urlMatch) {
              console.log("URLが見つかりませんでした");
              return;
            }
            const url = urlMatch[0];
            
            // YouTubeかMP3かの判定
            let type = "unknown";
            if (url.includes("youtube.com") || url.includes("youtu.be")) {
              type = "youtube";
            } else if (url.endsWith(".mp3") || url.includes("suno.com")) {
              type = "suno-mp3";
            }
            
            // playlist.jsonの読み込みと更新
            const filePath = 'playlist.json';
            let playlist = [];
            if (fs.existsSync(filePath)) {
              playlist = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            }
            
            playlist.push({
              url: url,
              type: type,
              added_at: new Date().toISOString(),
              issue_number: context.payload.issue.number
            });
            
            fs.writeFileSync(filePath, JSON.stringify(playlist, null, 2));

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          # 変更がある場合のみコミット
          if ! git diff-index --quiet HEAD; then
            git commit -m "Add new music from Issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "追加したよ！自動処理が完了しました🎉"
          gh issue close ${{ github.event.issue.number }}
